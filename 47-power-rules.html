  <title>The 48 Laws — Lived</title>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const laws = [
      { number:1, title:"Never Outshine the Master", theme:"Presence", color:"#C9A84C", principle:"Make those above you feel superior. Let them shine. Your moment will come — and it will be earned.", deeper:"This isn't about being small. It's about reading the room and knowing when your brilliance is a threat vs. an asset. People in authority — a boss, a father-in-law, a senior partner — need to feel respected, not eclipsed. The moment they feel you're trying to one-up them, they become your obstacle. The moment they feel elevated by you, they become your ally.", daily:["At work: Your boss pitches an idea in a meeting. You see a flaw. Don't call it out publicly. After the meeting, privately say 'I love the direction — can I share a thought that might strengthen it?' You're protecting him and positioning yourself as a partner.","With in-laws: Your father-in-law talks about how he raised your wife. Don't correct him or tell a better parenting story. Ask him questions. Let him be the wise elder. You gain enormous respect by making him feel respected.","With mentors: When a mentor gives advice, even if you know better now, acknowledge what their guidance gave you. Never correct them publicly."], redFlag:"You're doing this wrong if you're shrinking yourself permanently. The goal is timing — not permanent submission.", mantra:"My time will come. Today I plant seeds." },
      { number:2, title:"Never Put Too Much Trust in Friends", theme:"Awareness", color:"#8B4A6B", principle:"Be loving, but never naive. Watch actions, not just words. Friendship doesn't guarantee loyalty.", deeper:"This law sounds cold, but it's really about maintaining healthy awareness in all relationships. Friends can disappoint you not out of malice, but because their interests shift. The people who hurt you most are usually the ones you gave unconditional trust to. This doesn't mean be paranoid — it means be wise. Love people, but keep your eyes open.", daily:["With close friends: Someone who tells you 'I've always got your back' — watch what they do when you actually need backing. Trust the pattern of behavior over time, not the words in a good moment.","With family: Family loyalty is real, but family members are also human and have competing interests. Don't hand over financial decisions, business partnerships, or sensitive secrets based on blood alone.","At work: Your 'work best friend' is still a colleague with their own career goals. Be warm, but don't assume shared interests mean shared loyalty when a promotion is at stake."], redFlag:"This doesn't mean isolate or become cynical. It means: love people AND see them clearly.", mantra:"I love with my heart and see with my eyes." },
      { number:3, title:"Conceal Your Intentions", theme:"Protection", color:"#4A7B8B", principle:"Don't announce your plans before they're done. Let results speak. Silence is protection.", deeper:"When you share a goal before it's achieved, you open yourself to doubt, interference, unsolicited opinions, and — if you fail — public embarrassment. Not everyone who asks about your plans wishes you well. Even well-meaning people can unconsciously plant seeds of doubt. Build in silence. Reveal through results.", daily:["New business idea: Don't post about it, don't tell everyone at dinner. Tell your wife and one trusted person. Work on it. When it's real, share it.","Personal growth: You decide to start working out seriously. Don't announce it. Just show up for 90 days. Let the results be the announcement.","Conflict resolution: You're working on being more patient with your kids. Don't tell them 'I'm trying to be a better dad.' Just be one. They'll notice.","Career: You're pursuing a new role or raise. Don't broadcast it at work. Prepare quietly, execute, and let the opportunity materialize."], redFlag:"Concealment is not deception. You're not lying — you're protecting your process.", mantra:"I build in silence. I reveal through results." },
      { number:4, title:"Always Say Less Than Necessary", theme:"Presence", color:"#6B8B4A", principle:"Words are currency. Spend them wisely. Silence carries weight that constant talking never will.", deeper:"Over-explaining, over-justifying, and filling silence are all signals of insecurity. The person who speaks with intention is automatically perceived as more confident, more thoughtful, and more powerful. In arguments, less is more. In negotiations, less is more. Even in conversation — the person who listens deeply and responds precisely always commands the room.", daily:["In arguments with your wife: Instead of a 10-minute defensive speech, try: 'You're right, I dropped the ball on that. I'll fix it.' Full stop. Watch how the dynamic shifts.","At work meetings: Make 2-3 sharp points instead of 10 rambling ones. People will hang on your words more.","With your kids: Don't give a lecture every time they mess up. One clear sentence lands harder than five minutes of explanation.","Social settings: Ask more questions than you answer. The person who listens well is always remembered as the most interesting person in the room."], redFlag:"Silence isn't coldness. Pair it with warmth and eye contact so it reads as presence, not indifference.", mantra:"My words are chosen. My silence is intentional." },
      { number:5, title:"Guard Your Reputation", theme:"Reputation", color:"#8B6A4A", principle:"Your reputation is your most valuable long-term asset. Protect it by being consistent, not perfect.", deeper:"Reputation isn't built in a single heroic moment — it's built through thousands of small, consistent actions over time. Are you someone who does what you say? Are you reliable? Do you treat people with dignity even when it costs you something? That accumulation is what people call 'character.' Once that reputation is built, it walks into rooms before you do.", daily:["With your kids: If you say you'll be at the game, be at the game. If you say there's a consequence, follow through. Children remember patterns, not speeches.","With your wife: The small things compound. Making the coffee. Doing what you said you'd do. Being emotionally available when you said you would.","At work: Deliver a day early when possible. Respond to messages on time. Own mistakes without excuses.","In the community: Show up. Be the neighbor who helps. Be the dad who coaches the team."], redFlag:"Reputation is about consistency, not image management. Don't confuse the two.", mantra:"Who I am when no one is watching is who I really am." },
      { number:6, title:"Court Attention", theme:"Presence", color:"#7B4A8B", principle:"Don't disappear in your own life. Show up fully. Be present, engaged, and worth paying attention to.", deeper:"This law is often misread as 'be loud.' It actually means: don't be invisible. Many men shrink in their own families, their own careers, their own friendships — deferring, avoiding conflict, staying quiet. But the man who shows up fully — who has opinions, who engages, who is present — commands attention naturally without demanding it.", daily:["At home: Be actively present at dinner, not scrolling. Ask real questions. Tell stories. Be the person your family wants to talk to.","At work: Contribute in meetings. Share your perspective. Don't wait to be asked.","With friends: Be the one who plans something, initiates, shows up. The person who always shows up eventually becomes the center of the group.","With your wife: Court her. Still. Like you did at the beginning. Plan a date. Send a message during the day."], redFlag:"Attention-seeking and attention-worthy are opposite things. Earn it through substance.", mantra:"I show up fully. I am present in my own life." },
      { number:7, title:"Make Others Work, But Own the Value", theme:"Leadership", color:"#4A8B6B", principle:"Delegate intelligently. Collaborate genuinely. But know your value and make sure it's visible.", deeper:"This law gets misused as 'take credit for others' work.' The real lesson for a man of character is: don't let your contributions be invisible. If you do the hard work, the thinking, the lifting — don't be so humble that others walk off with the credit. Know your worth. Name your contributions clearly and confidently, without arrogance.", daily:["At work: When a project you led succeeds, be clear: 'My team executed brilliantly and I'm proud of the strategy we built together.' Own the leadership, share the credit for execution.","At home: Don't do everything yourself silently and then resent it. Build a family team. Delegate age-appropriate tasks to your kids.","In collaborations: If you bring an idea to a partnership, make sure it's documented as yours from the start. Not out of ego — out of self-respect."], redFlag:"Never take sole credit at the expense of others. Own leadership, share execution credit.", mantra:"I know my worth. I make it visible without arrogance." },
      { number:8, title:"Make Others Come to You", theme:"Emotional Intelligence", color:"#8B4A4A", principle:"Don't chase validation. Build yourself into someone worth coming to.", deeper:"Desperation is repulsive. Whether it's chasing approval from your boss, seeking constant reassurance from your wife, or needing external validation to feel good about yourself — it all communicates the same thing: low self-worth. The man who is grounded, who pursues his work and his values consistently, naturally draws people in. Stop chasing. Start becoming.", daily:["In your marriage: Neediness and clinginess push people away. Stay connected to your own life — your goals, your friendships, your growth. A man who has his own gravity is attractive to his partner.","At work: Don't constantly ask for feedback or reassurance. Do excellent work. Let that speak.","With your kids (teenagers especially): If you chase their approval, you lose their respect. Be present, be loving, hold your standards.","In friendships: Be the kind of friend people want to call, not the one who always needs something."], redFlag:"This isn't about being cold or withholding. It's about being self-sufficient emotionally.", mantra:"I am worth coming to. I build, I don't chase." },
      { number:9, title:"Win Through Actions, Never Through Argument", theme:"Emotional Intelligence", color:"#6B6B4A", principle:"Stop trying to win arguments. Win through demonstration. Show, don't tell.", deeper:"Arguments almost never change anyone's mind. They entrench positions and breed resentment. The most powerful thing you can do when someone doubts you is to go prove them wrong through your actions — quietly, consistently, over time. Your actions speak in a language no argument can compete with.", daily:["With your wife: She says you're not present enough. Don't argue about it. Start being more present. Within weeks, the argument is irrelevant — reality has changed.","At work: Someone doubts your idea. Instead of debating, ask for a small test run. Let the results argue for you.","With your kids: Don't lecture them about discipline, hard work, or integrity. Live those things. They're watching everything.","When criticized: Instead of defending yourself, ask 'what would convince you?' and then go do that thing."], redFlag:"This doesn't mean you can't speak up. It means don't make winning the argument the goal.", mantra:"My life is my argument. My actions are my words." },
      { number:10, title:"Avoid the Unhappy and Unlucky", theme:"Protection", color:"#8B7A4A", principle:"Energy is contagious. Choose your inner circle with intention.", deeper:"Some people are chronically negative, always in crisis, always the victim. Spending too much time with them doesn't lift them up — it pulls you down. This isn't about being cold to people who are going through hard times. It's about recognizing the difference between someone in a difficult season vs. someone whose identity is their suffering.", daily:["In friendships: Audit who you spend the most time with. Are they building something? Are they growing? Or are they primarily venting, complaining, and stuck?","At work: The chronic complainer who never does anything about their complaints will drain your energy and possibly damage your reputation by association.","Online: Social media consumption counts. The feeds and content you absorb daily shape your mindset. Curate aggressively.","In family: You can't always choose your family, but you can choose how much access they get to your mental space."], redFlag:"Don't abandon people in genuine crisis. This is about chronic patterns, not temporary hardship.", mantra:"I protect my energy. I choose who I let close." },
      { number:11, title:"Be Indispensable", theme:"Reputation", color:"#4A6B8B", principle:"Be so reliable and excellent that people can't imagine doing without you.", deeper:"This isn't about making yourself a slave to others' needs. It's about being genuinely excellent at what you do and genuinely reliable as a person. The man who shows up, who follows through, who brings something real to every table he sits at — that man is never easily replaced or disrespected.", daily:["At work: Become the person who knows how things really work. Develop a skill no one else has. Be the one people come to when things break.","At home: Be the anchor. The one your wife knows she can count on. The one your kids know will be there.","In your community: Show up for people before they ask. Help without keeping score.","In friendships: Be the friend who remembers things, who checks in, who shows up when it matters."], redFlag:"Don't confuse indispensable with people-pleasing. Excellence and reliability, not servility.", mantra:"I bring something real. I am reliable and excellent." },
      { number:12, title:"Use Selective Honesty", theme:"Awareness", color:"#8B4A5A", principle:"Be honest, but be strategic about when and how. Timing and framing matter enormously.", deeper:"Raw honesty without empathy or timing is just aggression wearing the mask of virtue. 'I'm just being honest' is often an excuse to say something hurtful without accountability. True honesty is delivered with care, at the right moment, framed in a way the other person can actually receive it.", daily:["With your wife: Brutal feedback delivered in anger or at the wrong moment isn't honesty, it's harm. Choose the moment. Choose the words. Say the hard thing lovingly.","With your kids: When your teenager shares something they're proud of and it's mediocre, don't crush it. Acknowledge the effort, then gently point toward improvement.","At work: If you see a problem, don't blurt it out in a full meeting. Bring it to the right person privately, with a solution attached.","In conflict: Lead with what's true about the other person's point before introducing your own."], redFlag:"Selective honesty is NOT dishonesty. It's emotional intelligence applied to truth-telling.", mantra:"I tell the truth. I choose the moment and the method." },
      { number:13, title:"Appeal to Self-Interest", theme:"How You Treat People", color:"#5A8B4A", principle:"Understand what people care about and speak to that. This is empathy in action.", deeper:"When you want someone to do something, help them see how it serves them. Not as manipulation, but as genuine understanding. People respond to 'here's how this helps you' infinitely more than 'here's why you should care about me.' This is one of the most practical communication skills you can develop.", daily:["With your kids: Instead of 'Clean your room because I said so,' try 'When your space is organized, you always find your stuff faster and feel better.'","With your wife: Instead of 'I need more alone time,' try 'I think if I get a couple hours to decompress on Saturdays, I'll be a lot more present and fun the rest of the weekend.'","At work: Instead of 'I need this resource,' show your boss how allocating it serves the company's goals.","In conflict: 'Here's what I think we both want, and here's how we get there' is collaboration."], redFlag:"This isn't manipulation — it's empathy. You're genuinely trying to find mutual benefit.", mantra:"I understand what others need. I find the path that serves us both." },
      { number:14, title:"Be Observant — Know People", theme:"Awareness", color:"#8B5A4A", principle:"Ask more. Listen deeply. The more you understand people, the more effectively you can connect.", deeper:"The most powerful people in any room are the ones who know what makes everyone else tick. Their fears, their motivations, their insecurities, their desires. This knowledge isn't for exploitation — it's for connection. When you truly understand someone, you can show up for them in exactly the way they need.", daily:["With your wife: What are her deepest fears? Her biggest unfulfilled dreams? What does she need to feel loved? The answers might surprise you. Ask. Listen without fixing.","With your kids: Every child has a different emotional language. One needs words of affirmation. Another needs your time. Another needs acts of service. Learn their language.","At work: Your boss's biggest pressure points are your leverage for proposing solutions. Know what keeps them up at night.","In conflict: Most conflict is about an unmet need, not the surface argument."], redFlag:"Use this knowledge to serve relationships, not to control or manipulate.", mantra:"I listen to understand. I know the people I love." },
      { number:15, title:"Hold Your Boundaries Completely", theme:"Protection", color:"#6A4A8B", principle:"When you set a boundary, hold it fully. Half-measures invite repeated violations.", deeper:"When you draw a line and then let it be crossed anyway, you don't just lose that one battle — you teach people that your boundaries are suggestions, not real. This destroys respect over time. Setting a boundary and holding it isn't aggression — it's self-respect made visible.", daily:["With your kids: If the consequence for a behavior is losing the phone for a week, it's losing the phone for a week. No renegotiating on day 3 because they're upset.","At work: If you said you won't work weekends, don't cave the first time a deadline is manufactured. Hold it once and it's established.","In relationships: If you've communicated that a certain behavior hurts you and it continues, what you do next either teaches them your boundary is real or it isn't.","With yourself: The most important boundaries are the ones you set for yourself. The bedtime you keep. The habit you don't return to."], redFlag:"Boundaries aren't walls. They're the fence line of self-respect — clear, calm, consistent.", mantra:"My word means something. My boundaries are real." },
      { number:16, title:"Use Absence Strategically", theme:"Reputation", color:"#4A8B8B", principle:"Scarcity creates value. Quality of presence matters more than constant availability.", deeper:"When you're always available for everything, people stop appreciating your presence. When you show up selectively and fully — that's when your presence means something. This isn't about being cold or withholding love. It's about understanding that the man who is always 'there' in body but nowhere in spirit is less present than the man who shows up intentionally and fully.", daily:["At work: You don't need to respond to every message within 5 minutes. Batch your responses. Be known for thoughtful, timely replies.","With friends: Don't be available for every casual hangout. But when you show up, be fully there. Quality over quantity.","In marriage: Don't smother. Have your own life, your own friendships, your own pursuits.","As a father: Focused, undivided time with your kids — even 30 minutes with zero distraction — is more powerful than hours of distracted presence."], redFlag:"This is NOT an excuse to be absent or emotionally unavailable. Show up less, but fully.", mantra:"When I show up, I am all there." },
      { number:17, title:"Be Pleasantly Unpredictable", theme:"Emotional Intelligence", color:"#8B8B4A", principle:"Surprise the people you love. Don't let life become so routine that people stop noticing you.", deeper:"Predictability is comfortable but invisible. When your family, your partner, your friends can predict your every move — you become furniture. Not disrespected, but unnoticed. The occasional unexpected gesture, the plan no one saw coming, the response that breaks a tired pattern — these create energy and keep relationships alive.", daily:["With your wife: Surprise her. Not with grand gestures — with small unexpected ones. A note. Booking a restaurant she mentioned once. Coming home early on a Tuesday.","With your kids: Break the routine. Take them somewhere random after school. Cook something weird together. Say yes when you'd normally say 'maybe later.'","At work: Come to a meeting with an angle no one expected. Propose something bold.","In conflict: Break the predictable fight pattern. Instead of escalating, disarm the situation with something unexpected — humor, agreement, a hug."], redFlag:"Unpredictability in values or reliability is chaos. Be unpredictable in your joy, your generosity, your creativity.", mantra:"I keep life alive. I surprise the people I love." },
      { number:18, title:"Don't Isolate — Stay Connected", theme:"Protection", color:"#4A8B5A", principle:"Your relationships are your strength. Isolation is not protection — it's vulnerability.", deeper:"Men tend to withdraw when stressed, overwhelmed, or hurting. It feels like protection. It's actually the opposite. Your network — your marriage, your friendships, your community — is your immune system. When you cut yourself off from it, you lose perspective, resilience, and the support that makes hard things survivable.", daily:["When you're struggling: Tell someone. Your wife. A close friend. A therapist. Asking for support is not weakness — it's the most strategically sound thing you can do.","In your marriage: Don't stonewall. Even if you need space to process, say 'I need a couple hours and then I want to come back to this.'","With male friendships: Most men let friendships atrophy after marriage and kids. Fight that. A man with no real male friendships is more brittle than he knows.","In your community: Church, neighborhood, sports league, volunteer work — be part of something beyond your household."], redFlag:"Boundaries and isolation are not the same thing. Stay connected while protecting your energy.", mantra:"My connections are my strength. I stay in the game." },
      { number:19, title:"Know Who You're Dealing With", theme:"Awareness", color:"#8B4A7A", principle:"Read people accurately. Different people require different approaches.", deeper:"Emotional intelligence is, at its core, the ability to adjust your approach based on who you're dealing with. The same message delivered the same way to two different people can land completely differently. The man who can read a room, read a person, and adjust accordingly — without losing himself — is a man of real social power.", daily:["With your kids: Your oldest might need direct, logical conversation. Your youngest might need warmth and story. Use the right key for each lock.","At work: Some colleagues need clear, direct feedback. Others need it wrapped in encouragement or they shut down.","In conflict: Some people need space before a hard conversation. Others need to hash it out immediately. Forcing your preferred style creates unnecessary friction.","With your wife: Learn how she processes emotion. Does she need to vent without you jumping to solutions? This single skill prevents more arguments than almost anything else."], redFlag:"Adapting your approach isn't being fake. It's being relationally intelligent.", mantra:"I see people clearly. I meet them where they are." },
      { number:20, title:"Keep Your Identity", theme:"Emotional Intelligence", color:"#5A6B8B", principle:"Be committed to the people you love without losing who you are.", deeper:"Many men — in marriage, in parenthood, in trying to please everyone — slowly erode their own identity. They stop having opinions. They give up hobbies. They defer on everything. And then they wonder why they feel invisible or why others stop respecting them. A man with a clear sense of self — his values, his interests, his direction — is a man worth respecting.", daily:["In marriage: Keep your own friendships. Keep your hobby. Have opinions. A marriage between two whole people is stronger than one between two halves.","As a father: Your kids need you to have an identity beyond 'dad.' Show them what a man who pursues his interests looks like.","At work: Don't be a yes-man. Be agreeable without being spineless. Contribute your actual perspective.","Personally: Know your values and live by them even when it costs you something."], redFlag:"Maintaining identity doesn't mean selfishness. It means showing up as a full person, not a people-pleasing shell.", mantra:"I am fully committed. I am also fully myself." },
      { number:21, title:"Let Others Underestimate You", theme:"Awareness", color:"#8B6A4A", principle:"You don't need to announce your capabilities. Let results surprise people.", deeper:"The ego wants constant recognition. Wisdom knows that underestimation is often an advantage. When people don't see you coming, you have freedom to move, build, and achieve without scrutiny or competition. The man who is always talking about what he's capable of is usually trying to convince himself. The man who says little and delivers much earns real respect.", daily:["New situation (new job, new group): Observe first. Listen. Ask questions. Don't come in announcing what you know. Earn the room.","In competition: Don't telegraph your strengths to competitors. Let them be surprised.","With skeptics: Someone doesn't believe in your plan? Don't argue. Smile. Work. Then send them the proof.","Personally: You don't need everyone to know your goals, your progress, your wins. The internal scoreboard is the only one that matters long-term."], redFlag:"Confidence is internal. Proving yourself constantly is the opposite of confidence.", mantra:"I don't need to announce my power. I demonstrate it." },
      { number:22, title:"Surrender to Win", theme:"Emotional Intelligence", color:"#7A8B4A", principle:"Sometimes yielding strategically is more powerful than resisting. Pick your battles.", deeper:"Knowing when to concede — in an argument, in a negotiation, in a conflict — is a mark of maturity, not weakness. When you insist on winning every battle, you often lose the relationship. The man who can say 'you're right' or 'let's try your way' without ego bruising is a man of real internal strength.", daily:["With your wife: She wants to handle something a certain way. You disagree, but it's not a values issue. Let her. Try it her way.","With your kids: Choose which hills to die on. Letting your teenager win a small argument occasionally builds more relationship capital than always being right.","At work: Sometimes agreeing with the group and then quietly executing brilliantly is more effective than fighting for your idea upfront.","In conflict: 'I hear you and I think you may be right' stops 90% of escalating arguments cold."], redFlag:"Surrender on style and approach. Never surrender your values or your dignity.", mantra:"I choose my battles. I win the ones that truly matter." },
      { number:23, title:"Concentrate Your Forces", theme:"How You Treat People", color:"#8B4A4A", principle:"Be fully present with whoever is in front of you. Full attention is the ultimate form of respect.", deeper:"We live in an era of constant distraction. The man who can put his phone down, look someone in the eyes, and give them his complete attention is increasingly rare and incredibly powerful. Full presence says: you matter. Nothing else competes with you right now. That is an extraordinary gift — and it costs nothing.", daily:["With your kids: Phone-free dinner. Phone-free bedtime routine. Ten minutes of full, undivided attention is worth more to a child than two hours of half-presence.","With your wife: When she's talking to you, stop what you're doing. Look at her. Respond to what she actually said.","At work: Single-tasking in meetings. The person who is fully present in every conversation is always the most respected.","With yourself: Full focus on one thing at a time. The quality of your output rises dramatically when your attention isn't split."], redFlag:"Full presence requires practice. Start with one context — maybe dinner — and expand from there.", mantra:"Where I am is where I am. I am fully here." },
      { number:24, title:"Play the Perfect Courtier", theme:"Presence", color:"#4A5A8B", principle:"Master the social environment. Be polished, perceptive, and gracious — in every room.", deeper:"This law is about social grace and emotional intelligence in professional and social settings. The man who knows how to read a room, make people feel at ease, compliment without flattering, and engage without dominating — that man moves through life with an ease that others call 'charisma.' It's learnable.", daily:["At social events: Remember people's names. Ask follow-up questions about something they mentioned last time you saw them.","In professional settings: Dress appropriately for the context. Speak clearly. Be curious about others before talking about yourself.","With your wife's family/friends: Be engaged, warm, interested. Ask questions. Put people at ease. Your wife notices how you treat the people she loves.","At your kids' events: Be the parent who is encouraging, not the one coaching loudly from the sideline."], redFlag:"Social grace is not people-pleasing. It's choosing to make others feel good in your presence.", mantra:"I make people feel seen. I move through every room with grace." },
      { number:25, title:"Re-create Yourself", theme:"Presence", color:"#8B4A6A", principle:"Don't be defined by your past self. You are always under construction.", deeper:"Too many men peak in their 20s — physically, emotionally, intellectually — and then coast. They become defined by who they were rather than who they're becoming. The most compelling men are the ones who are constantly evolving — learning new things, challenging old patterns, pursuing growth even when it's uncomfortable.", daily:["Physically: If you've let your body go, start again. Not for vanity — for energy, longevity, and self-respect. Your family needs you strong.","Intellectually: Read. Take a course. Learn something completely outside your expertise. Curious people are interesting people.","Emotionally: Work on your triggers, your patterns, your childhood wounds. Therapy is not weakness — it's maintenance for your most important instrument.","As a husband/father: The father you want to be might be very different from the one you are. Identify the gap. Work on it intentionally."], redFlag:"Re-creation is not reinvention for its own sake. It's intentional growth, rooted in your values.", mantra:"I am not finished. I am always becoming." },
      { number:26, title:"Keep Your Hands Clean", theme:"Reputation", color:"#4A8B7A", principle:"Stay above pettiness, drama, and moral compromise. Be the steady, fair one.", deeper:"In any group — family, workplace, social circle — drama happens. Gossip flows. People pull you into conflicts that aren't yours. The man who stays out of it, who refuses to talk badly about people behind their backs, who doesn't participate in pettiness — that man's reputation becomes bulletproof over time.", daily:["In the workplace: Don't gossip. Don't complain about colleagues to other colleagues. If you have an issue, address it directly or let it go.","In family conflict: Extended family drama — stay neutral unless it directly involves your household. Don't take sides. Don't carry messages.","With your kids: Don't vent to your kids about adult problems — especially about their other parent. Protect their innocence.","Online: Don't get into arguments on social media. It almost never ends well and leaves a permanent record."], redFlag:"Clean hands don't mean conflict avoidance. Address real issues directly. Just don't get dirty doing it.", mantra:"I don't do petty. I stay clean and I stay clear." },
      { number:27, title:"Create a Sense of Belonging", theme:"How You Treat People", color:"#7A4A8B", principle:"Make the people in your life feel they are part of something meaningful.", deeper:"People have a deep need to belong — to feel they are part of something larger than themselves. As a husband, a father, a friend, a leader — you have the power to create that sense of belonging for others. Family culture, shared rituals, a clear sense of 'we' — these are things you actively build, not things that happen by accident.", daily:["Family identity: Create rituals. Sunday dinners. A vacation every year. A phrase that's 'yours.' These become the architecture of family identity.","With your kids: Tell them the family story. What do you stand for? What are your values? Kids who know their family's story are more resilient.","With your wife: Build a shared vision. Where are you going together? What are you building? Couples with a shared mission have a powerful bond.","At work: Teams with a clear sense of mission outperform teams that are just doing tasks. Invest in the 'why.'"], redFlag:"Belonging can't be manufactured through pressure. It's built through shared experience and genuine inclusion.", mantra:"I build us. I make people feel they belong." },
      { number:28, title:"Enter Action with Boldness", theme:"Emotional Intelligence", color:"#8B7A4A", principle:"When you decide to move, move with full commitment. Hesitation is its own kind of failure.", deeper:"Timidity reads as lack of conviction. When you take action — in your career, in your relationship, in a hard conversation — do it with full commitment. Half-hearted attempts not only fail more often, they communicate to others (and to yourself) that you don't really believe in what you're doing.", daily:["Hard conversations: When you know you need to have a difficult talk — with your wife, your boss, your teenager — do it. Delaying almost always makes it worse.","New initiatives: If you're starting something — a business, a fitness regimen, a creative project — go all in. The wavering, tentative approach almost always fails.","Apologizing: When you're wrong, apologize boldly. 'I was wrong. I'm sorry. Here's what I'm going to do differently.' Clean and complete.","Decisions: Make decisions. Not rashly — but don't stall indefinitely either. Decide, communicate, and execute."], redFlag:"Boldness is not recklessness. Think first, commit fully, execute without apology.", mantra:"When I move, I move with full conviction." },
      { number:29, title:"Plan All the Way to the End", theme:"Leadership", color:"#4A7A8B", principle:"Think long term. Make decisions today based on where you're going, not just what feels good now.", deeper:"Reactive living — responding to whatever is urgent in front of you — is the enemy of a well-built life. The man who has a vision for his life, his family, his career, and makes daily decisions in alignment with that vision — that man ends up somewhere intentional. Most people end up somewhere accidental.", daily:["As a parent: Every parenting decision is a long-term investment. The discipline you enforce now, the values you model now — you're building an adult, not managing a child.","Financially: Where do you want to be in 10 years? What does that require you to do today? Short-term sacrifices for long-term security is a plan.","In your marriage: What kind of relationship do you want when your kids leave home? Work on that NOW.","At work: Where do you want to be in 5 years? What skills, relationships, and accomplishments does that require?"], redFlag:"Long-term planning doesn't mean ignoring the present. It means making the present serve the future.", mantra:"I know where I'm going. Every step serves the vision." },
      { number:30, title:"Make Excellence Look Effortless", theme:"Reputation", color:"#8B4A4A", principle:"Do the work fully. Don't constantly announce how hard you work.", deeper:"There's a difference between sharing your journey authentically and constantly narrating your effort as a bid for sympathy or credit. The man who grinds hard, delivers excellently, and speaks about it simply is far more compelling than the one who constantly recounts the sacrifice. Let your results be louder than your process.", daily:["At work: Don't complain about your workload to your team. Just deliver. If you're being exploited, that's a conversation with your manager — not a daily narrative to colleagues.","At home: If you handle something for the family, great. You don't need a medal. Martyrdom kills gratitude.","In fitness/health: You don't need to post every workout. Just get stronger. The results speak.","In self-improvement: You're reading, growing, changing — you don't need to narrate it constantly. Live the changes."], redFlag:"Vulnerability and sharing your process can be powerful. The line is between authentic sharing and seeking credit.", mantra:"I do the work. The work speaks for itself." },
      { number:31, title:"Structure Good Choices", theme:"Leadership", color:"#6A8B4A", principle:"As a leader — of your family, your team — structure options well. Give freedom within healthy limits.", deeper:"Real authority isn't about control — it's about creating an environment where the right choices are the easiest ones. In parenting especially, this is gold. You're not a dictator, but you're not a pushover either. You structure the environment so that your values are naturally reinforced without constant policing.", daily:["With younger kids: 'Do you want to do homework before or after your snack?' Both options get homework done. You've controlled the outcome while honoring their agency.","With teenagers: 'You can go to the party if you're home by midnight and check in at 10.' Freedom with structure. Reasonable limits with real autonomy.","At work: Give your team ownership of HOW they accomplish the goals you've set. Micromanaging the process while being clear about the outcome is the balance.","In your household: Establish family systems — chores, routines, expectations — so that order doesn't require constant enforcement."], redFlag:"Structure is not control. You're creating conditions for good decisions, not eliminating all choice.", mantra:"I lead by creating good conditions. I guide, I don't control." },
      { number:32, title:"Play to Their Fantasies", theme:"How You Treat People", color:"#8B5A4A", principle:"Understand what people dream about and help them feel it's possible.", deeper:"People are motivated by hope and possibility more than logic and reality. The man who can speak to someone's aspirations — who can help them believe in their own potential — is a man with enormous positive influence. This applies to how you parent, how you lead, how you love.", daily:["With your kids: Don't crush dreams with 'that's unrealistic.' Ask 'what would it take to make that happen?' Help them discover what's possible.","With your wife: Know her dreams — not just the daily logistics of her life, but what she actually wants for herself. Speak to those dreams.","At work: The best leaders help people see themselves in a bigger future. Invest in your team's growth with genuine belief in their potential.","In friendship: Be the person who sees what your friends are capable of, sometimes before they do."], redFlag:"Speak to possibility honestly. Don't create false hope — create genuine encouragement.", mantra:"I see what people can become. I speak to their potential." },
      { number:33, title:"Discover What Drives People", theme:"Awareness", color:"#4A8B6A", principle:"Know what motivates and concerns the people you love. Use this to connect better.", deeper:"Everyone has a 'thumbscrew' — something they care about deeply, something they fear, something that drives their behavior. Understanding this about the people in your life gives you enormous ability to connect meaningfully, to help them feel understood, and to avoid unintentional harm.", daily:["With your wife: What is she most afraid of? What does she most want for her life? What makes her feel most loved? If you can answer these clearly, you're already ahead of most husbands.","With your kids: What is each child most insecure about? What makes each one light up? Tailor your attention to their actual emotional world.","At work: What does your boss care about most? What does each team member need to feel valued?","In conflict: Most arguments are fueled by something deeper than the surface issue. Find the real driver."], redFlag:"This knowledge is for connection and empathy, never for exploitation.", mantra:"I understand what moves people. I use that to love them better." },
      { number:34, title:"Act Royally — In Your Own Way", theme:"Presence", color:"#8B4A8B", principle:"Carry yourself with quiet dignity. How you present yourself tells the world how to treat you.", deeper:"You don't need to be wealthy, titled, or famous to command respect through presence. The way you carry yourself — your posture, your tone, your calmness under pressure, your willingness to hold your standards — all of this communicates your self-concept to everyone around you. Upgrade your self-concept and your presence will follow.", daily:["Physically: Stand tall. Speak clearly. Make eye contact. Take up your appropriate space. These are not arrogant — they are dignified.","Under pressure: The man who stays calm when things go wrong is automatically perceived as the leader.","In how you dress: You don't need expensive clothes. But presenting yourself with care and intention communicates self-respect.","In how you speak about yourself: Stop self-deprecating excessively. 'I'm still learning' is humble. 'I'm terrible at this' is just bad framing."], redFlag:"Dignity is not arrogance. It's the quiet confidence of a man who knows his worth.", mantra:"I carry myself with dignity. I command respect through presence." },
      { number:35, title:"Master the Art of Timing", theme:"Emotional Intelligence", color:"#4A6A8B", principle:"The right message at the wrong time is the wrong message. Read when — not just what.", deeper:"Timing is one of the most underrated life skills. The same conversation, the same ask, the same piece of feedback — delivered at the right moment — can land beautifully. Delivered at the wrong moment, it can do real damage. Developing sensitivity to timing is a form of emotional intelligence that transforms your relationships.", daily:["With your wife: Don't bring up a serious issue when she just walked through the door, when she's exhausted, or in the middle of something stressful.","With your kids: Don't have important conversations in the heat of an argument. Let things cool down, then revisit. Information lands in calm, not in storm.","At work: Pitch new ideas when leadership is in a good mood, when wins are recent. The same idea can get rejected in January and approved in March.","In apologies: Apologize when you mean it, not just when the pressure to apologize is highest."], redFlag:"Timing is not procrastination. Hard things still need to be said — just said at the right moment.", mantra:"I read the moment. I act when the timing serves the outcome." },
      { number:36, title:"Respond to Provocations with Indifference", theme:"Protection", color:"#8B8B4A", principle:"Don't give people the satisfaction of seeing you rattled. Calm is power.", deeper:"Some people bait you. They push buttons, they make provocative statements, they try to throw you off balance. The most powerful response — almost universally — is calm non-reaction. When you react with anger, you've given them exactly what they wanted. When you respond with calm indifference, you've demonstrated that their attempts to destabilize you simply don't work.", daily:["At work: A colleague tries to undermine you in a meeting. You smile, acknowledge, and move on. Don't take the bait.","With difficult family members: The person who always has a cutting remark at every family gathering — stop engaging. Calm, brief responses take all the energy out of it.","Online: Nobody has ever regretted NOT engaging in a comment section argument.","In conflict with your kids (especially teenagers): When they push to get a rise out of you — stay calm. Your emotional regulation teaches them something invaluable."], redFlag:"Indifference to provocations is not indifference to people. Separate the bait from the person.", mantra:"I cannot be rattled. Calm is my most powerful response." },
      { number:37, title:"Create Memorable Moments", theme:"How You Treat People", color:"#4A8B8B", principle:"Be the person who creates experiences. Memories bond people more than routine.", deeper:"Life is made of moments, and the people who create extraordinary moments — for their families, their friends, the people they love — become irreplaceable. You don't need money to do this. You need intention, creativity, and the willingness to make life feel like something worth living.", daily:["With your family: Plan something unexpected once a month. A camping trip. A cooking challenge. A movie marathon. It doesn't have to be expensive — it has to be intentional.","With your wife: Create moments that are 'yours.' The place you first went to together. The song that means something. An annual tradition that's just about you two.","With your kids: The moments they'll remember aren't the expensive vacations — it's the Tuesday night you stayed up late watching movies together.","With friends: Be the one who plans things. The person who organizes the trip, the dinner, the game night — that person becomes the social hub of the group."], redFlag:"Moments require presence. A memorable experience you were distracted through doesn't count.", mantra:"I create moments. My family will remember this life." },
      { number:38, title:"Think Freely, Communicate Strategically", theme:"Awareness", color:"#8B4A5A", principle:"You don't have to share every opinion in every room. Know when your views serve and when they don't.", deeper:"Having strong opinions is valuable. Broadcasting them indiscriminately is not. The man who shares his most provocative views in every context isn't brave — he's reckless. True confidence knows which battles to engage and which rooms to simply observe. You can think freely and still choose your moments.", daily:["At family gatherings: Politics, religion, hot-button topics — the Thanksgiving table is rarely the place. Smile, listen, deflect with grace.","At work: Not every meeting needs your full editorial. Save your strong takes for the moments when they'll actually move something forward.","On social media: You're allowed to have opinions you don't post. The discipline of not sharing everything is increasingly rare and powerful.","In your marriage: There are thoughts you don't need to say out loud. It means filtering impulse from intention."], redFlag:"This is not about being dishonest. It's about knowing your audience and your timing.", mantra:"I think freely. I choose what I share and when." },
      { number:39, title:"Surface Problems Before They Explode", theme:"Emotional Intelligence", color:"#6B8B4A", principle:"Don't let issues fester. Gently surface tension before it becomes a crisis.", deeper:"Avoidance is the most common relationship killer. The issues couples don't address become the issues that end marriages. The feedback a leader doesn't give becomes the performance problem that costs the team. Learning to surface difficult things early, calmly, and constructively — before they reach explosion point — is a superpower.", daily:["In your marriage: When you notice a pattern that bothers you — don't wait until it's a full grievance. Bring it up gently early. 'Hey, I've noticed something I want to talk about — is now a good time?'","With your kids: Watch for early signs of struggle — social, academic, emotional. Address them before they become crises.","At work: If a project is going sideways, raise it with your manager before it's a disaster. Leaders respect proactive flag-raising.","With yourself: Notice your own moods and patterns. If you're slipping into a bad place, get help early."], redFlag:"Surfacing problems is not creating drama. It's preventing it.", mantra:"I address things early. Small fires are easy to put out." },
      { number:40, title:"Earn What You Value", theme:"Reputation", color:"#8B6A4A", principle:"Things earned are treasured. Things handed out are taken for granted. Teach this by example.", deeper:"The things we work hardest for are the things we value most deeply. This applies to everything — your career, your fitness, your relationship, your character. When life gives us things too easily, we don't appreciate them. When we earn things through effort and sacrifice, they become part of who we are.", daily:["With your kids: Let them earn their privileges. An allowance tied to contribution. A car tied to demonstrated responsibility. This builds character, not resentment.","Personally: Don't cut corners on the things that matter. The fitness you bought with discipline. The marriage you built with effort. These can't be shortcut.","At work: Don't expect advancement without excellence. Earn your seat at every table you want to sit at.","In relationships: Invest in the people you love. The effort you put into your marriage and your friendships is what makes them worth having."], redFlag:"This isn't about withholding love or making people suffer. It's about building a culture of contribution and earned respect.", mantra:"I earn what I have. I teach the value of effort." },
      { number:41, title:"Find Your Own Way", theme:"Presence", color:"#4A5A8B", principle:"Don't try to be your father, your hero, or anyone else. Forge your own path.", deeper:"Many men either spend their lives trying to be their father — or trying not to be their father. Both are reactions, not creations. The man who takes what was good from those who came before, learns from what wasn't, and builds something distinctly his own — that man has genuine authority. He's not a copy or a rejection. He's an original.", daily:["As a father: You don't have to parent the way you were parented. Take what worked. Leave what didn't. Build the father you wish you had, or the father you already had but made your own.","In your career: Don't follow the path that was expected of you if it's not yours. Choose with intention.","In your marriage: Your parents' marriage is not the template. Build the relationship that works for you and your wife.","In identity: Stop comparing yourself to men you admire and feeling inadequate. Be inspired by them. Then go be fully yourself."], redFlag:"Forging your own path doesn't mean rejecting wisdom from those before you. Stand on their shoulders, then climb higher.", mantra:"I learn from those before me. I build something that is mine." },
      { number:42, title:"Address the Real Source", theme:"Awareness", color:"#8B4A4A", principle:"Don't fight symptoms. Find the root. Address the real source of problems.", deeper:"In any conflict, dysfunction, or repeated problem — there is always a root cause below the surface issue. Addressing symptoms creates temporary relief. Addressing roots creates actual change. Learning to look beneath the surface — in your relationships, your work, your own behavior — is what separates reactive people from effective ones.", daily:["In recurring arguments: If you and your wife argue about the same thing repeatedly, the surface argument is not the issue. What is the unmet need? The unspoken fear? Go there.","With your kids' behavior: Misbehavior is communication. What is it saying? Attention-seeking? Stress at school? Fear? Address the signal, not just the behavior.","At work: Performance problems are usually system problems or communication problems — not people problems. Dig for the root.","In yourself: Recurring bad habits, recurring emotional reactions — what's underneath? Boredom? Fear? An unmet need?"], redFlag:"Finding the root requires curiosity, not judgment. Ask 'why is this happening' before 'what should I do about it.'", mantra:"I look beneath the surface. I address what's real." },
      { number:43, title:"Win Hearts, Not Just Minds", theme:"How You Treat People", color:"#5A8B7A", principle:"Logic changes positions. Emotion changes people. Win both to lead well.", deeper:"You can be completely right and still completely fail to influence someone, because you appealed only to their logic and ignored their emotions. People make decisions emotionally and justify them rationally. The man who understands this — who addresses both head and heart — is exponentially more effective in every relationship.", daily:["With your kids: Rules without relationship is rebellion. Before the logic of a rule, establish the connection. Kids who feel deeply loved are more responsive to guidance.","With your wife: An emotionally connected conversation will accomplish more in 10 minutes than a logical argument that goes for an hour. Lead with empathy.","At work: Before presenting your plan, address the concern you know people have. Acknowledge the emotional reality of the situation, then bring the data.","In apologies: An apology that simply acknowledges impact and commits to change goes straight to the heart."], redFlag:"This is empathy, not manipulation. You're not bypassing reason — you're honoring the whole person.", mantra:"I speak to the whole person. Heart and mind together." },
      { number:44, title:"Reflect Calmly in Conflict", theme:"Emotional Intelligence", color:"#8B7A4A", principle:"In conflict, calm mirroring disarms aggression better than escalation.", deeper:"When someone is heated and you match their energy — it escalates. When you stay calm and reflect what you're hearing, it often disarms them. You don't need to win the moment. You need to stay grounded, listen, reflect back what you're hearing, and wait for the temperature to drop. This takes practice but becomes your most powerful conflict tool.", daily:["With your wife in conflict: Instead of defending: 'It sounds like you're feeling like I haven't been showing up. Is that right?' Reflecting instead of reacting creates space.","With a difficult person at work: 'I hear that you're frustrated. Help me understand what you need from me.' Calm curiosity de-escalates almost everything.","With your teenagers: They want to see if you'll lose control. When you don't — when you stay calm and curious — you win instantly.","In high-stakes moments: Before responding in any heated situation, breathe. One slow breath before speaking gives you back your power."], redFlag:"Reflecting doesn't mean agreeing. It means acknowledging. You can still hold your position — calmly.", mantra:"I stay calm in the storm. My steadiness changes the weather." },
      { number:45, title:"Change Gradually, Not All at Once", theme:"Leadership", color:"#4A8B5A", principle:"People resist radical change, even good change. Be gradual, consistent, and patient.", deeper:"Whether you're changing yourself, changing the culture at home, or changing systems at work — doing it all at once creates resistance and overwhelm. The most lasting change happens incrementally, so steadily that people adapt without feeling threatened. One new habit. One new conversation pattern. One new family practice at a time.", daily:["In personal growth: Pick one thing to work on for 90 days. Not ten things. One. Nail it. Then add another.","In your marriage: If you want to change patterns in your relationship, start with one behavior. Be consistent there first before adding more.","With your kids: Introduce new responsibilities or standards gradually. Let them succeed at each level before raising the bar.","At work: If you're introducing change — new processes, new culture — do it in stages. Bring people along rather than announcing a revolution."], redFlag:"Gradual doesn't mean slow to start. Start today. Just don't try to do everything at once.", mantra:"One degree at a time. Consistent change compounds." },
      { number:46, title:"Never Appear Too Perfect", theme:"Presence", color:"#8B4A6A", principle:"Be human. Let people see you struggle and recover. Vulnerability done right builds deep respect.", deeper:"Perfection is alienating. Nobody connects with someone who appears to have no flaws, no struggles, no doubts. When you acknowledge mistakes, show your process, admit when you don't know — you become human, and humans connect with humans. Your family doesn't need a superhero. They need a man who is real.", daily:["With your kids: Let them see you fail at something and try again. 'Dad doesn't know how to do this — let's figure it out together.' This teaches more than any lecture.","With your wife: 'I handled that wrong and I'm sorry' is more bonding than 'here's why I was right.' Owning your imperfection creates intimacy.","At work: 'I don't know, but I'll find out' is more trustworthy than a confident wrong answer. Admitting uncertainty builds credibility.","As a leader: 'We didn't execute that well. Here's what we're going to do differently.' Accountability from the top creates psychological safety for the whole team."], redFlag:"Vulnerability is strength in the right doses. There's a difference between being human and being a mess.", mantra:"I am human and I own it. My imperfection makes me real." },
      { number:47, title:"Know When to Stop", theme:"Emotional Intelligence", color:"#4A8B8B", principle:"Victory taken too far becomes defeat. Know when enough is enough.", deeper:"Winning an argument and then continuing to drive the point home turns victory into cruelty. Disciplining a child appropriately and then piling on turns correction into humiliation. Achieving a goal and then immediately demanding more without celebration turns success into a treadmill. Knowing when to stop — in conflict, in pursuit, in discipline — is one of the most mature qualities a man can develop.", daily:["In arguments: Once the point is made and acknowledged — stop. You don't need to win every round. You don't need the last word. Stop.","In discipline with your kids: Correct the behavior, explain why, apply the consequence — then move on. Don't bring it up again. Don't hold it over them. It's done.","In negotiations: Know what 'good enough' looks like. Pushing past it loses you goodwill and often the deal itself.","In achievement: Celebrate your wins before immediately chasing the next thing. The man who never stops to appreciate what he's built teaches his family that nothing is ever enough."], redFlag:"Knowing when to stop is not quitting. It's emotional mastery and strategic wisdom.", mantra:"I know when I've won. I stop there." },
      { number:48, title:"Be Formless — Stay Adaptable", theme:"Presence", color:"#6A4A8B", principle:"The most resilient men are adaptable. Rigidity breaks. Flexibility endures.", deeper:"Life will change around you constantly — your kids' needs, your wife's seasons, your career landscape, your own body and mind. The man who can adapt — who doesn't have only one way of doing things, only one mode of being — is the man who endures and thrives. Strength is knowing when to bend without breaking.", daily:["As a father: The father of a toddler and the father of a teenager need to be different people. Grow with your kids. What worked at 5 won't work at 15.","As a husband: Your wife is not the same person you married — and neither are you. Adapt to each other. Stay curious about who she's becoming.","At work: Industries change. Skills become obsolete. The man who holds rigidly to 'how things have always been done' gets left behind.","In your own growth: Let your beliefs evolve. Let new information change your mind. Intellectual flexibility is a form of strength, not weakness."], redFlag:"Formlessness doesn't mean having no identity or values. Your core is fixed. Your methods are flexible.", mantra:"My values are rock. My methods are water." }
    ];

    const themes = ["All","Presence","Awareness","Protection","Reputation","Leadership","Emotional Intelligence","How You Treat People"];

    function App() {
      const [selectedLaw, setSelectedLaw] = useState(null);
      const [activeTheme, setActiveTheme] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");
      const [activeTab, setActiveTab] = useState("daily");
      const [isMobile, setIsMobile] = useState(window.innerWidth < 700);

      useEffect(() => {
        const handler = () => setIsMobile(window.innerWidth < 700);
        window.addEventListener("resize", handler);
        return () => window.removeEventListener("resize", handler);
      }, []);

      useEffect(() => {
        document.body.style.overflow = (isMobile && selectedLaw) ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [isMobile, selectedLaw]);

      const filtered = laws.filter(law => {
        const matchTheme = activeTheme === "All" || law.theme === activeTheme;
        const matchSearch = searchQuery === "" ||
          law.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          law.principle.toLowerCase().includes(searchQuery.toLowerCase());
        return matchTheme && matchSearch;
      });

      function closeLaw() { setSelectedLaw(null); setActiveTab("daily"); }

      function DetailPanel({ law }) {
        return (
          <div style={{background:"#0f0f0f",border:`1px solid ${law.color}33`,borderRadius:isMobile?"0":"4px",display:"flex",flexDirection:"column",minWidth:0,height:isMobile?"100%":"auto"}}>
            <div style={{background:"linear-gradient(135deg,#141414 0%,#1a1208 100%)",borderBottom:`1px solid ${law.color}33`,padding:"20px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"12px"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:"10px",color:law.color,letterSpacing:"3px",marginBottom:"6px",textTransform:"uppercase"}}>LAW {law.number} · {law.theme}</div>
                  <h2 style={{fontSize:isMobile?"18px":"22px",color:"#f0e8d8",margin:"0 0 10px",fontWeight:"400",lineHeight:"1.3"}}>{law.title}</h2>
                  <p style={{fontSize:"13px",color:"#b0a890",margin:0,fontStyle:"italic",lineHeight:"1.6"}}>{law.principle}</p>
                </div>
                <button onClick={closeLaw} style={{background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:"50%",color:"#a0a090",fontSize:"18px",cursor:"pointer",width:"34px",height:"34px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
              </div>
            </div>
            <div style={{display:"flex",borderBottom:"1px solid #1a1a1a"}}>
              {[{id:"daily",label:isMobile?"Practice":"Daily Practice"},{id:"deeper",label:isMobile?"Deeper":"The Deeper Truth"},{id:"mantra",label:isMobile?"Mantra":"Red Flag & Mantra"}].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{flex:1,padding:"12px 4px",background:"none",border:"none",borderBottom:`2px solid ${activeTab===tab.id?law.color:"transparent"}`,color:activeTab===tab.id?law.color:"#4a4030",fontSize:"10px",letterSpacing:"0.5px",textTransform:"uppercase",cursor:"pointer",fontFamily:"Georgia,serif",transition:"all 0.2s"}}>{tab.label}</button>
              ))}
            </div>
            <div style={{padding:"20px",overflowY:"auto",flex:1}}>
              {activeTab === "deeper" && <p style={{fontSize:"14px",color:"#c0b8a8",lineHeight:"1.85",margin:0}}>{law.deeper}</p>}
              {activeTab === "daily" && (
                <div>
                  <div style={{fontSize:"10px",color:"#4a4030",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"16px"}}>Practical Examples</div>
                  {law.daily.map((ex,i) => (
                    <div key={i} style={{marginBottom:"16px",paddingLeft:"14px",borderLeft:`2px solid ${law.color}44`}}>
                      <p style={{fontSize:"13px",color:"#b0a890",lineHeight:"1.75",margin:0}}>{ex}</p>
                    </div>
                  ))}
                </div>
              )}
              {activeTab === "mantra" && (
                <div>
                  <div style={{background:"#1a1208",border:"1px solid #2a1a08",borderRadius:"4px",padding:"16px",marginBottom:"16px"}}>
                    <div style={{fontSize:"10px",color:"#8B4A4A",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"8px"}}>⚠ Watch Out For</div>
                    <p style={{fontSize:"13px",color:"#c0b8a8",lineHeight:"1.7",margin:0}}>{law.redFlag}</p>
                  </div>
                  <div style={{background:`${law.color}11`,border:`1px solid ${law.color}33`,borderRadius:"4px",padding:"20px",textAlign:"center"}}>
                    <div style={{fontSize:"10px",color:law.color,letterSpacing:"2px",textTransform:"uppercase",marginBottom:"12px"}}>Your Mantra</div>
                    <p style={{fontSize:"15px",color:"#f0e8d8",fontStyle:"italic",lineHeight:"1.6",margin:0}}>"{law.mantra}"</p>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      return (
        <div style={{minHeight:"100vh",background:"#0a0a0a",fontFamily:"Georgia,'Times New Roman',serif",color:"#e8e0d0"}}>
          {isMobile && selectedLaw && (
            <div style={{position:"fixed",inset:0,zIndex:999,background:"#0a0a0a",overflowY:"auto",display:"flex",flexDirection:"column"}}>
              <DetailPanel law={selectedLaw} />
            </div>
          )}
          <div style={{background:"linear-gradient(180deg,#1a1208 0%,#0a0a0a 100%)",borderBottom:"1px solid #2a2010",padding:"32px 20px 24px",textAlign:"center"}}>
            <div style={{fontSize:"10px",letterSpacing:"4px",color:"#C9A84C",textTransform:"uppercase",marginBottom:"10px"}}>A Framework for Character & Respect</div>
            <h1 style={{fontSize:"clamp(22px,6vw,48px)",fontWeight:"400",margin:"0 0 8px",color:"#f0e8d8",letterSpacing:"1px"}}>The 48 Laws — Lived</h1>
            <p style={{color:"#7a7060",fontSize:"13px",margin:0,fontStyle:"italic"}}>Not to dominate. To become someone worth respecting.</p>
          </div>
          <div style={{padding:"16px",maxWidth:"1100px",margin:"0 auto"}}>
            <input type="text" placeholder="Search laws..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
              style={{width:"100%",padding:"12px 16px",background:"#141414",border:"1px solid #2a2010",borderRadius:"4px",color:"#e8e0d0",fontSize:"16px",fontFamily:"Georgia,serif",marginBottom:"12px",outline:"none",boxSizing:"border-box"}} />
            <div className="theme-scroll" style={{display:"flex",gap:"8px",marginBottom:"20px",overflowX:"auto",paddingBottom:"2px",WebkitOverflowScrolling:"touch"}}>
              {themes.map(t => (
                <button key={t} onClick={() => setActiveTheme(t)} style={{padding:"7px 14px",background:activeTheme===t?"#C9A84C":"#141414",border:`1px solid ${activeTheme===t?"#C9A84C":"#2a2010"}`,borderRadius:"2px",color:activeTheme===t?"#0a0a0a":"#7a7060",fontSize:"11px",letterSpacing:"0.5px",textTransform:"uppercase",cursor:"pointer",fontFamily:"Georgia,serif",whiteSpace:"nowrap",flexShrink:0}}>{t}</button>
              ))}
            </div>
            {!isMobile && (
              <div style={{display:"flex",gap:"24px",alignItems:"flex-start"}}>
                <div style={{display:"grid",gridTemplateColumns:selectedLaw?"repeat(auto-fill,minmax(130px,1fr))":"repeat(auto-fill,minmax(160px,1fr))",gap:"10px",flex:selectedLaw?"0 0 300px":"1",maxHeight:selectedLaw?"80vh":"none",overflowY:selectedLaw?"auto":"visible"}}>
                  {filtered.map(law => (
                    <div key={law.number} onClick={() => { setSelectedLaw(selectedLaw?.number===law.number?null:law); setActiveTab("daily"); }}
                      style={{background:selectedLaw?.number===law.number?"#1a1208":"#0f0f0f",border:`1px solid ${selectedLaw?.number===law.number?law.color:"#1a1a1a"}`,borderRadius:"4px",padding:selectedLaw?"12px":"16px",cursor:"pointer",position:"relative",overflow:"hidden",transition:"border-color 0.2s"}}>
                      <div style={{position:"absolute",top:0,left:0,right:0,height:"2px",background:law.color,opacity:selectedLaw?.number===law.number?1:0.4}} />
                      <div style={{fontSize:selectedLaw?"10px":"11px",color:law.color,letterSpacing:"2px",marginBottom:"6px"}}>LAW {law.number}</div>
                      <div style={{fontSize:selectedLaw?"11px":"13px",color:"#e8e0d0",lineHeight:"1.4",fontWeight:"600"}}>{law.title}</div>
                      {!selectedLaw && <div style={{marginTop:"8px",fontSize:"10px",color:"#4a4030",textTransform:"uppercase",letterSpacing:"1px"}}>{law.theme}</div>}
                    </div>
                  ))}
                </div>
                {selectedLaw && <div style={{flex:1,minWidth:0}}><DetailPanel law={selectedLaw} /></div>}
              </div>
            )}
            {isMobile && (
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:"10px"}}>
                {filtered.map(law => (
                  <div key={law.number} onClick={() => { setSelectedLaw(law); setActiveTab("daily"); }}
                    style={{background:"#0f0f0f",border:"1px solid #1a1a1a",borderRadius:"4px",padding:"14px 12px",cursor:"pointer",position:"relative",overflow:"hidden",minHeight:"80px",display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
                    <div style={{position:"absolute",top:0,left:0,right:0,height:"2px",background:law.color,opacity:0.7}} />
                    <div>
                      <div style={{fontSize:"10px",color:law.color,letterSpacing:"1px",marginBottom:"5px"}}>LAW {law.number}</div>
                      <div style={{fontSize:"12px",color:"#e8e0d0",lineHeight:"1.4",fontWeight:"600"}}>{law.title}</div>
                    </div>
                    <div style={{marginTop:"8px",fontSize:"9px",color:"#3a3020",textTransform:"uppercase",letterSpacing:"1px"}}>{law.theme}</div>
                  </div>
                ))}
              </div>
            )}
            {!selectedLaw && (
              <div style={{marginTop:"32px",padding:"24px 20px",background:"#0f0f0f",border:"1px solid #1a1a1a",borderRadius:"4px",textAlign:"center"}}>
                <div style={{fontSize:"10px",color:"#C9A84C",letterSpacing:"3px",textTransform:"uppercase",marginBottom:"14px"}}>The Core Truth</div>
                <p style={{fontSize:"14px",color:"#b0a890",fontStyle:"italic",lineHeight:"1.8",maxWidth:"600px",margin:"0 auto"}}>
                  "Be consistent, be self-aware, be someone whose actions speak louder than his words, protect your energy, and lead with character rather than ego."
                </p>
                <p style={{fontSize:"12px",color:"#3a3020",marginTop:"14px"}}>Tap any law to explore it fully →</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
